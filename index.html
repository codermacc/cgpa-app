<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="description" content="Track and predict your CGPA effortlessly" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CGPA Calc" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>CGPA Calculator</title>
  <link rel="stylesheet" href="/src/css/variables.css" />
  <link rel="stylesheet" href="/src/css/main.css" />
  <link rel="stylesheet" href="/src/css/onboarding.css" />
  <link rel="stylesheet" href="/src/css/forms.css" />
  <link rel="stylesheet" href="/src/css/dashboard.css" />
</head>
<body>
  <div id="app">
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <div class="splash-logo">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="16" fill="#16a34a"/>
            <path d="M20 44L32 20L44 44" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 37H40" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="splash-title">CGPA Calculator</h1>
        <p class="splash-subtitle">Academic Excellence Tracker</p>
        <div class="splash-loader">
          <div class="splash-loader-bar"></div>
        </div>
      </div>
    </div>

    <!-- App Container -->
    <div id="app-container" class="app-container hidden">
      <div id="page-content" class="page-content"></div>
      <nav id="bottom-nav" class="bottom-nav hidden"></nav>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
